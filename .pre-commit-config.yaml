---
repos:
  - repo: local
    hooks:
      - id: biome
        name: Lint code using Biome
        entry: npx biome ci --no-errors-on-unmatched
        language: system
        types: [text]
      - id: store
        name: Lint store migrations
        entry: ./tools/ci/lint-store-migrations.sh
        language: system
        types: [text]
        files: internal/store/.*
