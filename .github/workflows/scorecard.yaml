name: OpenSSF Scorecard

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  branch_protection_rule:
  push:
    branches:
      - main
  # To guarantee Maintained check is occasionally updated.
  # SEE: https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    # As we're publishing results, use some random time to even out the
    # potential load on the servers
    - cron: "57 03 * * 0"

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      security-events: write # Upload results
      id-token: write # Publish results
      contents: read
      issues: read # Read issues
      pull-requests: read # Read review status etc.
      checks: read # Read PR status etc.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee #v4.39.0
        with:
          sarif_file: results.sarif
          category: OpenSSF Scorecard
